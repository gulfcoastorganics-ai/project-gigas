name: Refresh Vite Lock

on:
  push:
    branches:
      - launch/software-release-2026-08-26
    paths:
      - .github/workflows/refresh-vite-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: launch/software-release-2026-08-26
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package-lock.json
          git commit -m 'Resolve Project Gigas Vite lock' || exit 0
          git push origin HEAD:launch/software-release-2026-08-26
